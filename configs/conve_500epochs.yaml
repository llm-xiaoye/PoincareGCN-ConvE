seed: 42

data:
  add_inverse_relations: true

model:
  embedding_dim: 100
  gcn_dim: 100
  num_filters: 250
  kernel_size: 6
  reshape_height: 10
  reshape_width: 20
  curvature: 1.0
  graph_dropout: 0.1
  hidden_dropout: 0.2
  feature_dropout: 0.2

training:
  epochs: 500
  batch_size: 256
  optimizer: riemannian_adam
  learning_rate: 0.001
  weight_decay: 0.0
  label_smoothing: 0.1
  gradient_clip: 1.0
  patience: 50
  min_delta: 0.00001
  num_workers: 10

evaluation:
  batch_size: 128
  hits: [1, 3, 5]
